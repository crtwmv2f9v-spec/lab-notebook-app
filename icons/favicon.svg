<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a33"/><stop offset="1" stop-color="#06070d"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.22" cy="0.18" r="0.7"><stop offset="0" stop-color="#6c5cff" stop-opacity="0.55"/><stop offset="1" stop-color="#6c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.92" r="0.65"><stop offset="0" stop-color="#00d1b2" stop-opacity="0.40"/><stop offset="1" stop-color="#00d1b2" stop-opacity="0"/></radialGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff0d0"/><stop offset="0.55" stop-color="#7d6bff"/><stop offset="1" stop-color="#ff7ac0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#g1)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#g2)"/>
    <!-- back card -->
    <g transform="rotate(9 512 520)" opacity="0.55">
      <rect x="300" y="250" width="440" height="540" rx="58" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
    </g>
    <!-- front glass card -->
    <g transform="rotate(-6 512 520)" filter="url(#soft)">
      <rect x="282" y="236" width="460" height="568" rx="62" fill="url(#glass)" stroke="url(#edge)" stroke-width="3"/>
      <path d="M352 330H560M352 380H500" stroke="#ffffff" stroke-opacity="0.38" stroke-width="16" stroke-linecap="round"/>
      <!-- curve glow -->
      <path d="M352 700 C 450 700, 470 690, 512 600 S 600 470, 672 462" fill="none" stroke="url(#curve)" stroke-width="40" stroke-linecap="round" filter="url(#blur)" opacity="0.85"/>
      <path d="M352 700 C 450 700, 470 690, 512 600 S 600 470, 672 462" fill="none" stroke="url(#curve)" stroke-width="22" stroke-linecap="round"/>
      <circle cx="672" cy="462" r="26" fill="#ff7ac0" filter="url(#blur)" opacity="0.9"/>
      <circle cx="672" cy="462" r="15" fill="#fff"/>
    </g>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
